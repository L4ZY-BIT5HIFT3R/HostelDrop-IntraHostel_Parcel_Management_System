# Render blueprint for the HostelDrop backend.
# Deploy: connect this repo on render.com → "New +" → "Blueprint".
# Secret values (sync: false) must be filled in the Render dashboard; they are
# intentionally not committed. JWT_SECRET_KEY is generated by Render.
services:
  - type: web
    name: hosteldrop-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # --- Required secrets (set in the Render dashboard) ---
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Auto-generated strong secret for JWT signing.
      - key: JWT_SECRET_KEY
        generateValue: true
      # --- Optional (recommended for production) ---
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
